<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160" role="img" aria-labelledby="title desc">
  <title id="title">LD Purple Logo</title>
  <desc id="desc">A purple LD monogram with a transparent diagonal slit separating the L and D.</desc>

  <defs>
